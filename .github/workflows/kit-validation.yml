name: Kit Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kit-health:
    name: Health check + integrity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run kit health check (doctor.py)
        run: python .agent/scripts/doctor.py

      - name: Run kit integrity tests
        run: python -m pytest .agent/tests/test_kit_integrity.py -v

  diff-gates:
    # Until now CI only proved the kit was internally consistent. A PR could
    # still introduce a hardcoded secret, break lint, or leave a doc pointing at
    # a file it deleted. These gates check the change itself (PRD A16).
    name: Diff gates (secrets, lint, docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changed-file list needs the base commit, which a shallow
          # clone does not have.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: pip install pytest ruff

      - name: Collect changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          git diff --name-only --diff-filter=ACMR "$base" HEAD > changed.txt || true
          echo "Changed files:"; cat changed.txt
          # Memory logs and the PRD archive are records, not live documentation:
          # they quote files from other repos and from proposals that were never
          # built, so a dead-reference check on them is noise by construction.
          grep -E '\.md$' changed.txt \
            | grep -Ev '^(\.agent/memory/|docs/prd-)' > changed-docs.txt || true
          echo "Docs to check for drift:"; cat changed-docs.txt

      - name: Secret scan (blocks on critical)
        run: >
          python .agent/skills/vulnerability-scanner/scripts/security_scan.py .
          --output summary --fail-on critical

      - name: Project validation (checklist.py --pre-commit)
        run: python .agent/scripts/checklist.py . --pre-commit

      - name: Documentation drift on changed docs
        run: |
          if [ -s changed-docs.txt ]; then
            xargs -a changed-docs.txt python .agent/scripts/doc_drift_check.py --strict --files
          else
            echo "No markdown changed in this diff; scanning the core docs instead."
            python .agent/scripts/doc_drift_check.py --strict
          fi

      - name: Docs match disk (sync_docs.py --check)
        run: python .agent/scripts/sync_docs.py --check

      - name: Memory size ceiling (memory_rotate.py --check)
        run: python .agent/scripts/memory_rotate.py --check
